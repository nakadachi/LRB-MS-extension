[build-system]
requires = ["cython>=3.0.2","setuptools>=68.2.2","numpy>=1.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ldpc"

description = "LDPC: Python Tools for Low Density Parity Check Codes"
readme = "README.md"
authors = [
    { name = "Joschka Roffe", email = "joschka@roffe.eu" }
]
license = { file = "LICENSE" }

classifiers = [
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.9.3",
    "tqdm",
    "pytest",
    "stim",
    "sinter>=1.12.0",
    "pymatching"
]
version = "2.4.1"

[project.urls]
Documentation = "https://software.roffe.eu/ldpc"

[tool.setuptools.packages.find]
where = ["src_python"]  
include = ["ldpc","ldpc.*"]

# Formatting and lint rules for the Python code added by the Qulid extension
# (run: ruff format <files> && ruff check <files>).
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
# Single-letter capitals (A, B, H_A, H_B) follow the papers' notation.
ignore = ["N802", "N803", "N806", "N816", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["ldpc"]
# helper modules imported by the example scripts
known-local-folder = [
    "bb_codes", "benchmark", "circuit_setup", "distance", "harness", "mbp_ladder",
    "qtanner_codes", "search_432", "search_codes", "search_large",
]
